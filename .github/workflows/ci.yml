# Roda lint, tipos, testes (com PostgreSQL 16 de serviço) e npm audit a cada alteração.
# Nada vai para produção com teste falhando (RNF-13).
name: CI

on:
  push:
  pull_request:

jobs:
  verificar:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patotinha_app
          POSTGRES_PASSWORD: senha_ci
          POSTGRES_DB: patotinha_teste
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patotinha_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://patotinha_app:senha_ci@localhost:5432/patotinha
      DATABASE_URL_TESTE: postgresql://patotinha_app:senha_ci@localhost:5432/patotinha_teste
      JWT_SECRET: segredo-somente-para-o-ci-com-mais-de-32-caracteres
      NODE_ENV: test
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test

  ponta-a-ponta:
    runs-on: ubuntu-latest
    needs: verificar
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: patotinha_app
          POSTGRES_PASSWORD: senha_ci
          POSTGRES_DB: patotinha
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U patotinha_app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://patotinha_app:senha_ci@localhost:5432/patotinha
      DATABASE_URL_E2E: postgresql://patotinha_app:senha_ci@localhost:5432/patotinha
      JWT_SECRET: segredo-somente-para-o-ci-com-mais-de-32-caracteres
      TZ: America/Sao_Paulo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: relatorio-playwright
          path: playwright-report
