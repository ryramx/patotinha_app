# Publicação no Render (etapa 7 do plano): a aplicação em Docker e um PostgreSQL 16 gerenciado.
# O Render cuida do HTTPS (com redirecionamento de http) e do backup diário do banco nos planos pagos.
services:
  - type: web
    name: patotinha-pedidos
    runtime: docker
    plan: starter
    region: virginia
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/saude
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: patotinha-banco
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: NODE_ENV
        value: production
      - key: TZ
        value: America/Sao_Paulo

databases:
  - name: patotinha-banco
    databaseName: patotinha
    user: patotinha_app
    plan: basic-256mb
    region: virginia
    postgresMajorVersion: '16'
    ipAllowList: [] # sem acesso público direto; só a aplicação do Render (PRD 10)
